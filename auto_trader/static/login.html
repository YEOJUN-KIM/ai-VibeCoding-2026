<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 · 프라이빗 투자 데스크</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/login.js" defer></script>
</head>
<body class="login-page">
  <main class="login-layout">
    <section class="login-intro">
      <p class="eyebrow">PRIVATE INVESTMENT DESK</p>
      <h1>프라이빗<br>투자 데스크</h1>
      <p>실제 자산부터 시장 탐색과 모의 전략까지 연결하는 개인 투자 워크스페이스입니다.</p>
      <div class="security-note">
        <span class="security-icon">✓</span>
        <div><strong>로컬 전용 접속</strong><small>현재 서버는 127.0.0.1에서만 실행됩니다.</small></div>
      </div>
    </section>
    <section class="login-card panel">
      <div>
        <p class="section-kicker">DESK ACCESS</p>
        <h2>투자 데스크 로그인</h2>
        <p class="login-help">등록된 관리자 계정으로 개인 워크스페이스에 접속합니다.</p>
      </div>
      <form id="login-form" autocomplete="on">
        <label>관리자 아이디
          <input id="username" name="username" type="text" minlength="3" maxlength="50" autocomplete="username" required autofocus>
        </label>
        <label>비밀번호
          <input id="password" name="password" type="password" maxlength="128" autocomplete="current-password" required>
        </label>
        <button class="button primary full" id="login-button" type="submit">로그인</button>
      </form>
      <p class="form-message" id="login-message" role="alert"></p>
      <p class="login-footnote">관리자 생성은 웹이 아닌 터미널에서만 가능합니다.</p>
    </section>
  </main>
</body>
</html>
